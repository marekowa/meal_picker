<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Champion</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
    margin: 0;
}

h1 {
    margin-top: 20px;
}

#battle {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 20px;
    flex-wrap: wrap;
}

#additional_options {
    display: flex;
    justify-content: left;
    gap: 30px;
    padding: 20px;
    flex-wrap: wrap;
}
.card button {
    padding: 5px;
}

.card {
    cursor: pointer;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    width: 320px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    transition: transform 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.card h2 {
    padding: 10px;
}

#progress {
    margin: 15px;
    font-size: 18px;
}

#winner {
    font-size: 28px;
    margin-top: 40px;
}
</style>
</head>

<body>

<h1>🏆 Food Champion</h1>

<div id="progress"></div>

<div id="battle">
    <div class="card" onclick="vote('left')">
        <img id="img1">
        <h2 id="name1"></h2>
        <div class="additional_options">
            <button onclick="stash('left')">
            🐹 Zachomikuj
            </button>
        </div>

    </div>

    <div class="card" onclick="vote('right')">
        <img id="img2">
        <h2 id="name2"></h2>
        <button onclick="stash('left')">
        🐹 Zachomikuj
        </button>
    </div>
</div>

<div id="winner"></div>

<script>

const foods = [
"pizza",
"burger",
"sushi",
"ramen",
"taco",
"steak",
"fried chicken",
"shawarma",
"pho",
"pad thai",
"dumplings",
"lasagna",
"burrito",
"hot dog",
"croissant",
"mac and cheese",
"gyros",
"bibimbap",
"poke bowl",
"lobster roll",
"paella",
"falafel",
"butter chicken",
"curry",
"brisket",
"wings",
"nachos",
"carbonara",
"risotto",
"birria taco",
"hot honey pizza",
"bagel",
"boba tea",
"cucumber salad",
"loaded fries",
"bao buns",
"korean corn dog",
"acai bowl",
];

let champion = foods[0];
let challengerIndex = 1;
let championImage = "";
let savedFoods = [];

const UNSPLASH_KEY = "eKifVGQ608YFLiQwPTHBZM4Ctnx1WpEk2A7dg9IZ2sk";
const NUM_ROUNDS = 10;

async function getImage(food) {
    const response = await fetch(
        `https://api.unsplash.com/search/photos?query=${encodeURIComponent(food)}&per_page=1&client_id=${UNSPLASH_KEY}`
    );

    const data = await response.json();

    if (data.results.length > 0) {
        return data.results[0].urls.regular;
    }

    return "https://via.placeholder.com/600x400?text=No+Image";
}

async function render() {

    if (challengerIndex >= foods.length || challengerIndex >= NUM_ROUNDS) {
        document.getElementById("battle").style.display = "none";

        document.getElementById("winner").innerHTML =
            `     <h2>🏆 Champion: ${champion} </h2>
            <img src="${championImage}"
                style="width:400px;border-radius:12px;">`;

        return;
    }

    document.getElementById("name1").textContent = champion;
    document.getElementById("name2").textContent = foods[challengerIndex];
    
    const imgChampion = await getImage(champion);
    const imgChallenger = await getImage(foods[challengerIndex]);

    document.getElementById("img1").src = imgChampion;
    document.getElementById("img2").src = imgChallenger;

    championImage = imgChampion;

    document.getElementById("progress").textContent =
        `Round ${challengerIndex}/${NUM_ROUNDS}`;
}


function stash(side) {

    const food =
        side === "left"
        ? champion
        : foods[challengerIndex];

    const image =
        side === "left"
        ? document.getElementById("img1").src
        : document.getElementById("img2").src;

    savedFoods.push({
        name: food,
        image: image
    });

    alert(`${food} zachomikowane 🐹`);
}

function vote(side) {

    if (side === "right") {
        champion = foods[challengerIndex];
    }

    challengerIndex++;
    render();
}

render();

</script>

<div id="saved"></div>
</body>
</html>
