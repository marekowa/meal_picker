<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Champion</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
    margin: 0;
}

h1 {
    margin-top: 20px;
}

#battle {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 20px;
    flex-wrap: wrap;
}

.card {
    cursor: pointer;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    width: 320px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    transition: transform 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.card h2 {
    padding: 10px;
}

#progress {
    margin: 15px;
    font-size: 18px;
}

#winner {
    font-size: 28px;
    margin-top: 40px;
}
</style>
</head>

<body>

<h1>🏆 Food Champion</h1>

<div id="progress"></div>

<div id="battle">
    <div class="card" onclick="vote('left')">
        <img id="img1">
        <h2 id="name1"></h2>
    </div>

    <div class="card" onclick="vote('right')">
        <img id="img2">
        <h2 id="name2"></h2>
    </div>
</div>

<div id="winner"></div>

<script>

const foods = [
"pizza",
"burger",
"sushi",
"ramen",
"taco",
"steak",
"fried chicken",
"shawarma",
"pho",
"pad thai",
"dumplings",
"lasagna",
"burrito",
"hot dog",
"croissant",
"cheesecake",
"ice cream",
"donut",
"mac and cheese",
"gyros",
"bibimbap",
"poke bowl",
"lobster roll",
"paella",
"falafel",
"butter chicken",
"naan",
"curry",
"brisket",
"wings",
"nachos",
"carbonara",
"risotto",
"pancakes",
"waffles",
"churros",
"mochi",
"dubai chocolate",
"birria taco",
"hot honey pizza",
"cookies",
"bagel",
"boba tea",
"cucumber salad",
"loaded fries",
"bao buns",
"korean corn dog",
"acai bowl",
"gelato",
"tiramisu"
];

let champion = foods[0];
let challengerIndex = 1;

function imageUrl(food) {
    return `https://source.unsplash.com/600x400/?${encodeURIComponent(food)}`;
}

function render() {

    if (challengerIndex >= foods.length) {

        document.getElementById("battle").style.display = "none";

        document.getElementById("winner").innerHTML =
            `🏆 Champion:<br><br>${champion}`;

        return;
    }

    document.getElementById("name1").textContent = champion;
    document.getElementById("img1").src = imageUrl(champion);

    document.getElementById("name2").textContent = foods[challengerIndex];
    document.getElementById("img2").src = imageUrl(foods[challengerIndex]);

    document.getElementById("progress").textContent =
        `Round ${challengerIndex} / ${foods.length - 1}`;
}

function vote(side) {

    if (side === "right") {
        champion = foods[challengerIndex];
    }

    challengerIndex++;
    render();
}

render();

</script>

</body>
</html>
